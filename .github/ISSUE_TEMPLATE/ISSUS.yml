name: 错误报告 (Bug Report)
description: 提交与整合包相关的问题与反馈 | Submit issues and feedback related to the modpack
title: "[BUG]: "
labels:
  - 整合包/Modpack
  - 问题/Bug
projects:
  - Reverie-Foundry/Issues
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 错误报告指南 | Bug Report Guidelines
        请详细描述您遇到的问题，这将帮助我们快速定位和修复问题。
        Please provide detailed description of the issue you encountered, which will help us quickly identify and fix the problem.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 前提确认 | Prerequisites Confirmation
      description: 请确认以下事项 | Please confirm the following
      options:
        - label: 我已检查过现有议题，确认这是新问题 | I have checked existing issues and confirmed this is a new bug
          required: true
        - label: 我使用的是最新版整合包 | I am using the latest version of the modpack
          required: true

  - type: input
    id: modpack-version
    attributes:
      label: 整合包版本 | Modpack Version
      description: 您正在使用的具体版本号 | The specific version number you are using
      placeholder: "例如/Example: 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 问题类型 | Issue Type
      description: 请选择遇到的问题类型 | Please select the type of issue you encountered
      options:
        - "游戏崩溃 (Game Crash)"
        - "功能异常 (Function Abnormal)"
        - "性能问题 (Performance Issue)"
        - "视觉错误 (Visual Bug)"
        - "配方问题 (Recipe Issue)"
        - "其他问题 (Other Issue)"
    validations:
      required: true

  - type: textarea
    id: issue-details
    attributes:
      label: 问题详情 | Issue Details
      description: 请详细描述问题的情况 | Please provide detailed description of the issue
      placeholder: |
        ## 问题描述 | Problem Description
        - 问题现象/Phenomenon:
        - 发生时间/When it occurred: 
        - 影响范围/Impact:

        ## 行为对比 | Behavior Comparison
        - 预期行为/Expected Behavior: 正常情况下应该...
        - 实际行为/Actual Behavior: 但实际上发生了...

        ## 复现步骤 | Reproduction Steps
        1. 第一步 | Step 1
        2. 第二步 | Step 2
        3. 第三步 | Step 3
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 错误日志 | Error Logs
      description: 请提供相关的错误日志（如有） | Please provide relevant error logs (if any)
      placeholder: |
        请将日志内容粘贴在此处，或提供日志文件链接
        Please paste log content here or provide a link to log files
    validations:
      required: false

  - type: textarea
    id: media-evidence
    attributes:
      label: 截图/视频证据 | Screenshots/Video Evidence
      description: 请提供相关的截图或视频 | Please provide relevant screenshots or videos
      placeholder: |
        请提供图片链接或描述截图内容
        Please provide image links or describe screenshot content
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息 | Additional Context
      description: 添加任何其他相关信息 | Add any other relevant information
      placeholder: "其他可能有助于解决问题的信息 | Other information that may help resolve the issue"
    validations:
      required: false
