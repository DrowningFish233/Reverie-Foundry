name: 建议功能 (Feature Suggestion)
description: 提交与整合包相关的新功能或修改建议 | Submit new feature or modification suggestions for the modpack
title: "[建议/Suggestion]: "
labels:
  - 整合包/Modpack
  - 建议/Suggestion
projects:
  - Reverie-Foundry/Suggestions
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 建议提交指南 | Suggestion Guidelines
        请详细描述您希望添加的功能建议，我们将认真考虑每一个想法。
        Please provide detailed description of your feature suggestion. We will carefully consider every idea.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 重复检查 | Duplicate Check
      description: 请确认您已检查过此建议是否已存在 | Please confirm you have checked if this suggestion already exists
      options:
        - label: 我已检查过现有议题，确认这是新建议 | I have checked existing issues and confirmed this is a new suggestion
          required: true

  - type: input
    id: modpack-version
    attributes:
      label: 整合包版本 | Modpack Version
      description: 您正在使用的整合包版本号 | The version number of the modpack you are using
      placeholder: "例如/Example: 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: suggestion-type
    attributes:
      label: 建议类型 | Suggestion Type
      description: 请选择建议的类型 | Please select the type of suggestion
      options:
        - "新增功能 (New Feature)"
        - "功能改进 (Feature Improvement)"
        - "游戏平衡 (Game Balance)"
        - "用户体验 (User Experience)"
        - "性能优化 (Performance Optimization)"
        - "其他 (Other)"
    validations:
      required: true

  - type: textarea
    id: suggestion-details
    attributes:
      label: 建议详情 | Suggestion Details
      description: 请详细描述您的建议 | Please provide detailed description of your suggestion
      placeholder: |
        建议名称/Suggestion Name: 
        详细描述/Detailed Description:
        预期效果/Expected Outcome:
        相关模组/Related Mods (如有/if any):
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: 理由说明 | Rationale
      description: 请说明为什么这个建议对整合包有益 | Please explain why this suggestion would benefit the modpack
      placeholder: "这个建议将改善... | This suggestion would improve..."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息 | Additional Context
      description: 添加任何其他相关信息或截图 | Add any other relevant information or screenshots
      placeholder: "可在此处添加图片链接或额外说明 | You can add image links or additional notes here"
    validations:
      required: false
